<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-light">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-tasks"></i>
                <span class="sidebar-text">TaskFlow</span>
            </div>
            <button class="sidebar-close" id="sidebar-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-item active">
                <i class="fas fa-home"></i>
                <span class="sidebar-text">Dashboard</span>
            </a>
            <a href="{{ url_for('dashboard') }}" class="nav-item">
                <i class="fas fa-check-square"></i>
                <span class="sidebar-text">Tasks</span>
            </a>
            <a href="{{ url_for('calendar') }}" class="nav-item">
                <i class="fas fa-calendar-day"></i>
                <span class="sidebar-text">Calendar</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-bell"></i>
                <span class="sidebar-text">Notifications</span>
                <span class="notification-badge">3</span>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <i class="fas fa-user"></i>
                <span class="sidebar-text">Profile</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="nav-left">
                <button class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search tasks..." id="search-input">
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="profile-menu">
                    <img src="{{ url_for('static', filename='images/profile.jpg') }}" alt="Profile" class="profile-avatar">
                    <div class="profile-dropdown">
                        <a href="{{ url_for('profile') }}">
                            <i class="fas fa-user"></i> Profile
                        </a>
                        <a href="{{ url_for('dashboard') }}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a href="{{ url_for('create_task') }}">
                            <i class="fas fa-plus"></i> New Task
                        </a>
                        <hr>
                        <a href="{{ url_for('logout') }}">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
