<!DOCTYPE html>
<html lang="en" data-theme="{{ request.cookies.get('theme','light') }}">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='calendar_icon.png') }}">

    <style>
        /* Dark theme body */
        body[data-theme="dark"] {
            background: #121212;
            color: #ddd;
        }

        /* Dark card helper */
        .dark-card {
            background: #1f1f1f;
            color: white;
        }

        /* Navbar dark mode */
        body[data-theme="dark"] .navbar {
            background-color: #1f1f1f !important;
        }

        /* Alerts dark mode */
        body[data-theme="dark"] .alert {
            background-color: #2c2c2c;
            color: #ddd;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='task.png') }}" width="32" class="me-2">
            Task Tracker
        </a>

        <div class="d-flex ms-auto">
            {% if session.get('user_id') %}
                <!-- Calendar -->
                <a class="btn btn-light me-2 d-flex align-items-center" href="{{ url_for('calendar_view') }}">
                    <i class="bi bi-calendar-event me-1"></i> Calendar
                </a>

                <!-- Theme Toggle -->
                <a id="theme-toggle" class="btn btn-secondary me-2 d-flex align-items-center" href="#">
                    <i class="bi bi-moon-stars me-1"></i> Theme
                </a>

                <!-- Logout -->
                <a class="btn btn-danger d-flex align-items-center" href="{{ url_for('logout') }}">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script>
document.getElementById('theme-toggle').addEventListener('click', async function(e) {
    e.preventDefault();

    // Call Flask endpoint to toggle cookie
    await fetch('{{ url_for("toggle_theme") }}');

    // Switch data-theme
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const newTheme = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);

    // Dispatch event for calendar and other components
    document.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: newTheme } }));
});
</script>

</body>
</html>
