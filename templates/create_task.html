{% extends "base.html" %}

{% block title %}Create Task - Task Manager{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-plus-circle fa-2x text-primary me-3"></i>
                        <div>
                            <h2 class="card-title mb-1">Create New Task</h2>
                            <p class="text-muted mb-0">Add a new task to your task list</p>
                        </div>
                    </div>

                    <form method="POST" action="{{ url_for('create_task') }}">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Task Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority</label>
                                    <select class="form-select" id="priority" name="priority">
                                        <option value="Low">Low</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="due_date" class="form-label">Due Date</label>
                                    <input type="datetime-local" class="form-control" id="due_date" name="due_date">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="estimate_hours" class="form-label">Estimate Hours</label>
                                    <input type="number" class="form-control" id="estimate_hours" name="estimate_hours" step="0.5" min="0.5" value="1.0">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="tags" class="form-label">Tags</label>
                                    <input type="text" class="form-control" id="tags" name="tags" placeholder="work, urgent, personal">
                                    <div class="form-text">Separate tags with commas</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="recurrence" class="form-label">Recurrence</label>
                                    <select class="form-select" id="recurrence" name="recurrence">
                                        <option value="">No recurrence</option>
                                        <option value="daily">Daily</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {% if current_user.is_facilitator %}
                        <div class="mb-3">
                            <label for="assignee" class="form-label">Assign To</label>
                            <select class="form-select" id="assignee" name="assignee">
                                <option value="">Unassigned</option>
                                {% for user in users %}
                                <option value="{{ user.id }}">{{ user.name or user.email }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Create Task</button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
