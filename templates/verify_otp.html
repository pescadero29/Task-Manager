{% extends "base.html" %}

{% block title %}Verify OTP - Task Manager{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
                        <h2 class="card-title">Verify Your Email</h2>
                        <p class="text-muted">Enter the OTP sent to your email</p>
                    </div>

                    <form method="POST" action="{{ url_for('verify_otp') }}">
                        <div class="mb-3">
                            <label for="otp" class="form-label">One-Time Password</label>
                            <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp"
                                   placeholder="Enter 6-digit code" maxlength="6" required>
                            <div class="form-text text-center">
                                Check your email for the verification code
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Verify OTP</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-2">
                            <a href="{{ url_for('login') }}" class="text-primary">Try different email</a>
                        </p>
                        <p class="mb-0">
                            <a href="{{ url_for('login') }}" class="text-muted">Resend OTP</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-focus the OTP input
document.addEventListener('DOMContentLoaded', function() {
    const otpInput = document.getElementById('otp');
    if (otpInput) {
        otpInput.focus();
    }
});

// Auto-submit when 6 digits are entered
document.getElementById('otp').addEventListener('input', function(e) {
    const value = e.target.value.replace(/\D/g, '');
    e.target.value = value;

    if (value.length === 6) {
        // Auto-submit the form
        e.target.form.submit();
    }
});
</script>
{% endblock %}
