{% extends "base.html" %}
{% block content %}

<h3 class="mb-3"><i class="bi bi-bell"></i> Notifications</h3>

{% if notifications %}
  <div class="list-group">
    {% for n in notifications %}
    <div class="list-group-item {% if request.cookies.get('theme')=='dark' %}dark{% endif %}">
      <div class="d-flex justify-content-between">
        <div>
          <h5 class="mb-1">{{ n.title }}</h5>
          <p class="mb-1">{{ n.message }}</p>
          <small class="text-muted">{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted mt-4">No notifications yet.</p>
{% endif %}

{% endblock %}
