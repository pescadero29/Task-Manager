{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">

    <div class="card shadow-sm {% if request.cookies.get('theme')=='dark' %}dark{% endif %}">
      <div class="card-body text-center">

        <h3 class="mb-3"><i class="bi bi-envelope-check"></i> Verify Account</h3>
        <p class="text-muted">Enter the 6-digit code sent to your email.</p>

        <form method="post">

          <div class="mb-3">
            <input name="otp" class="form-control text-center fs-4" maxlength="6" required>
          </div>

          <button class="btn btn-primary w-100">
            <i class="bi bi-check-circle"></i> Verify
          </button>

          <div class="mt-3">
            <a href="{{ url_for('resend_otp') }}">Resend Code</a>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
