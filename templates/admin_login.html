{% extends "base.html" %}

{% block title %}Admin Login - TaskFlow{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <div class="card shadow-lg border-0 fade-in-up">
                <div class="card-body p-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                            <i class="fas fa-shield-alt text-danger fs-1"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-2">Admin Login</h2>
                        <p class="text-muted mb-0">Access the admin panel</p>
                    </div>

                    <!-- Login Form -->
                    <form method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input class="form-control border-start-0 ps-0" id="email" name="email" type="email"
                                       placeholder="Enter admin email" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-dark">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input class="form-control border-start-0 ps-0" id="password" name="password" type="password"
                                       placeholder="Enter password" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="otp" class="form-label fw-semibold text-dark">OTP (Optional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-key text-muted"></i>
                                </span>
                                <input class="form-control border-start-0 ps-0" id="otp" name="otp" type="text"
                                       placeholder="Enter OTP if required" />
                            </div>
                        </div>

                        <button class="btn btn-danger w-100 py-3 fw-semibold mb-3" type="submit">
                            <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                        </button>
                    </form>

                    <!-- Footer -->
                    <div class="text-center">
                        <p class="text-muted mb-3">Not an admin?</p>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-medium">
                            User Login
                        </a>
                    </div>
                </div>
            </div>

            <!-- Additional Info -->
            <div class="text-center mt-4">
                <small class="text-muted">
                    Admin access is restricted to authorized personnel only.
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
