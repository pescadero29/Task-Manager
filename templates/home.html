{% extends 'base.html' %}
{% block content %}
<div class="text-center mt-5">
  <h1>Hello, {{ current_user.name or 'User' }}!</h1>
  <p class="lead">Quick access to your tasks and reminders.</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg me-2"><i class="bi bi-list-task"></i> My Tasks</a>
  {% if current_user.is_facilitator %}
  <a href="{{ url_for('inbox') }}" class="btn btn-success btn-lg"><i class="bi bi-inbox"></i> Inbox</a>
  {% endif %}
</div>
{% endblock %}
