{% extends "base.html" %}
{% block content %}

<h3 class="mb-3"><i class="bi bi-journal-text"></i> Activity Logs</h3>

{% if logs %}
  <table class="table table-bordered {% if request.cookies.get('theme')=='dark' %}table-dark{% endif %}">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Activity</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        <td>{{ log.action }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p class="text-muted mt-3">No logs yet.</p>
{% endif %}

{% endblock %}
