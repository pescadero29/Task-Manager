{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">
          {% if task %}Edit Task{% else %}New Task{% endif %}
        </h3>

        <form method="post" action="{{ form_action }}">

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input 
              type="text" 
              name="title" 
              class="form-control" 
              maxlength="150" 
              required
              value="{{ (form.title if form and form.title is defined) or (task.title if task) or '' }}">
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea 
              name="description" 
              class="form-control" 
              rows="4">{{ (form.description if form and form.description is defined) or (task.description if task) or '' }}</textarea>
          </div>

          <!-- Category and Due Date -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <input 
                type="text" 
                name="category" 
                class="form-control"
                value="{{ (form.category if form and form.category is defined) or (task.category if task) or '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Due Date</label>
              <input 
                type="date" 
                name="due_date" 
                class="form-control"
                value="{{ (form.due_date if form and form.due_date is defined) or (task.due_date if task and task.due_date) or '' }}">
            </div>
          </div>

          <!-- Status (only for editing) -->
          {% if task %}
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
              <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
          </div>
          {% endif %}

          <!-- Buttons -->
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              {% if task %}Update Task{% else %}Create Task{% endif %}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
