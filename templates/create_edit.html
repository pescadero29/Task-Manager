{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">

    <div class="card shadow-sm {% if request.cookies.get('theme')=='dark' %}dark{% endif %}">
      <div class="card-body">

        <h3 class="mb-3">{{ "Edit Task" if task else "New Task" }}</h3>

        <form method="post" action="{{ form_action }}" enctype="multipart/form-data">

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input name="title" class="form-control" required
                   value="{{ task.title if task else '' }}">
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ task.description if task else '' }}</textarea>
          </div>

          <!-- Category -->
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input name="category" class="form-control"
                   value="{{ task.category if task else '' }}">
          </div>

          <!-- Priority -->
          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select">
              <option value="Low" {% if task and task.priority=='Low' %}selected{% endif %}>Low</option>
              <option value="Medium" {% if (not task) or task.priority=='Medium' %}selected{% endif %}>Medium</option>
              <option value="High" {% if task and task.priority=='High' %}selected{% endif %}>High</option>
            </select>
          </div>

          <!-- Due Date -->
          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" name="due_date" class="form-control"
                   value="{{ task.due_date if task and task.due_date else '' }}">
          </div>

          <!-- Status (only when editing) -->
          {% if task %}
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Pending"   {% if task.status=='Pending' %}selected{% endif %}>Pending</option>
              <option value="Completed" {% if task.status=='Completed' %}selected{% endif %}>Completed</option>
            </select>
          </div>
          {% endif %}

          <!-- Attachment -->
          <div class="mb-3">
            <label class="form-label">Attachment</label>
            <input type="file" name="attachment" class="form-control">
            {% if task and task.attachment %}
              <small class="text-muted">
                Current: 
                <a href="{{ url_for('attachment', filename=task.attachment) }}" target="_blank">
                  {{ task.attachment }}
                </a>
              </small>
            {% endif %}
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary">{{ "Update" if task else "Create" }}</button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
