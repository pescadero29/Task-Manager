{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:720px">
  <div class="card-body">
    <h5>Edit Task</h5>
    <form method="post" novalidate>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input class="form-control" name="title" value="{{ task.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows=3>{{ task.description }}</textarea>
      </div>
      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">Due date</label>
          <input class="form-control" type="datetime-local" name="due_date" id="due_date_edit" value="{{ task.due_date.strftime('%Y-%m-%dT%H:%M') if task.due_date else '' }}">
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">Estimate (hours)</label>
          <input class="form-control" type="number" name="estimate_hours" value="{{ task.estimate_hours }}" min="0.1" step="0.1" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Priority</label>
        <select class="form-select" name="priority">
          <option {% if task.priority=='Timely' %}selected{% endif %}>Timely</option>
          <option {% if task.priority=='Prompt' %}selected{% endif %}>Prompt</option>
          <option {% if task.priority=='Immediate' %}selected{% endif %}>Immediate</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Tags</label>
        <input class="form-control" name="tags" value="{{ task.tags }}">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="completed" id="completed" {% if task.completed %}checked{% endif %}>
        <label class="form-check-label" for="completed">Completed</label>
      </div>
      <div class="mb-3">
        <label class="form-label">Assign to</label>
        <select class="form-select" name="assignee">
          <option value="">(None)</option>
          {% for u in users %}
            <option value="{{ u.id }}" {% if task.assignee==u.id %}selected{% endif %}>{{ u.email }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
<script>
  function setMinDateTime(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const now = new Date();
    const year = now.getFullYear();
    const month = (now.getMonth() + 1).toString().padStart(2, '0');
    const day = now.getDate().toString().padStart(2, '0');
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const minDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
    input.min = minDateTime;
  }

  function validateDueDateIsFuture(event, inputId) {
    const input = document.getElementById(inputId);
    if (!input) return true;
    const dueDateStr = input.value;
    if (!dueDateStr) return true;
    const dueDate = new Date(dueDateStr);
    const now = new Date();
    if (dueDate < now) {
      event.preventDefault();
      alert("Due date cannot be in the past. Please select a valid date and time.");
      input.focus();
      return false;
    }
    return true;
  }

  document.addEventListener('DOMContentLoaded', function() {
    setMinDateTime('due_date_edit');
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', function(e) {
        if (!validateDueDateIsFuture(e, 'due_date_edit')) {
          return;
        }
      });
      setInterval(() => setMinDateTime('due_date_edit'), 60000);
    }
  });
</script>
{% endblock %}
