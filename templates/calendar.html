{% extends "base.html" %}

{% block title %}Calendar - Task Manager{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 mb-1">Calendar View</h1>
                    <p class="text-muted mb-0">View and manage your tasks by date</p>
                </div>
                <a href="{{ url_for('create_task') }}" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>New Task
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div id="calendar" style="height: 700px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Task Details Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalTitle">Task Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="taskModalBody">
                <!-- Task details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <a href="#" class="btn btn-primary" id="editTaskBtn">Edit Task</a>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: function(fetchInfo, successCallback, failureCallback) {
            fetch('/api/tasks')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch tasks');
                    }
                    return response.json();
                })
                .then(data => {
                    // Transform events to FullCalendar format
                    var events = data.map(task => {
                        var eventColor = '#2563eb'; // default blue
                        if (task.priority === 'High') {
                            eventColor = '#dc2626'; // red
                        } else if (task.priority === 'Medium') {
                            eventColor = '#d97706'; // amber
                        } else if (task.priority === 'Low') {
                            eventColor = '#059669'; // green
                        }

                        return {
                            id: task.id,
                            title: task.title,
                            start: task.due_date, // map due_date to start
                            backgroundColor: eventColor,
                            borderColor: eventColor,
                            textColor: '#ffffff',
                            extendedProps: {
                                description: task.description,
                                priority: task.priority,
                                estimate_hours: task.estimate_hours,
                                completed: task.completed
                            }
                        };
                    });
                    successCallback(events);
                })
                .catch(error => {
                    console.error('Error loading calendar events:', error);
                    failureCallback(error);
                });
        },
        eventClick: function(info) {
            var task = info.event;
            var description = task.extendedProps.description || 'No description';
            var priority = task.extendedProps.priority || 'Not set';
            var estimate = task.extendedProps.estimate_hours || 'Not set';
            var completed = task.extendedProps.completed ? 'Yes' : 'No';

            var modalBody = document.getElementById('taskModalBody');
            modalBody.innerHTML = `
                <div class="row">
                    <div class="col-md-8">
                        <h4>${task.title}</h4>
                        <p class="text-muted">${description}</p>
                        <div class="row mt-3">
                            <div class="col-sm-6">
                                <strong>Priority:</strong> <span class="badge bg-${priority === 'High' ? 'danger' : priority === 'Medium' ? 'warning' : 'success'}">${priority}</span>
                            </div>
                            <div class="col-sm-6">
                                <strong>Status:</strong> <span class="badge bg-${completed === 'Yes' ? 'success' : 'secondary'}">${completed === 'Yes' ? 'Completed' : 'Pending'}</span>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-6">
                                <strong>Estimate:</strong> ${estimate} hours
                            </div>
                            <div class="col-sm-6">
                                <strong>Due Date:</strong> ${task.start ? new Date(task.start).toLocaleDateString() : 'Not set'}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('editTaskBtn').href = `/task/${task.id}/edit`;

            var modal = new bootstrap.Modal(document.getElementById('taskModal'));
            modal.show();
        },
        dateClick: function(info) {
            // Handle date click to create new task
            var selectedDate = info.dateStr;
            var modalBody = document.getElementById('taskModalBody');
            modalBody.innerHTML = `
                <div class="text-center">
                    <h4>Create New Task</h4>
                    <p class="text-muted">Create a task for ${new Date(selectedDate).toLocaleDateString()}</p>
                    <a href="/task/new?due_date=${selectedDate}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Create Task
                    </a>
                </div>
            `;

            document.getElementById('editTaskBtn').style.display = 'none';

            var modal = new bootstrap.Modal(document.getElementById('taskModal'));
            modal.show();

            // Reset edit button when modal is hidden
            document.getElementById('taskModal').addEventListener('hidden.bs.modal', function() {
                document.getElementById('editTaskBtn').style.display = 'inline-block';
            }, { once: true });
        },
        height: 'auto',
        aspectRatio: 1.35,
        eventDisplay: 'block',
        dayMaxEvents: true,
        moreLinkClick: 'popover'
    });

    try {
        calendar.render();
    } catch (error) {
        console.error('Error rendering calendar:', error);
        calendarEl.innerHTML = '<div class="alert alert-danger">Error loading calendar. Please refresh the page.</div>';
    }
});
</script>
{% endblock %}
