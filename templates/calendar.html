{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-calendar3"></i> Task Calendar</h3>
  <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
    <i class="bi bi-list-task"></i> Back to Tasks
  </a>
</div>

<div id="calendar"></div>

<!-- FullCalendar Styles & Script -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    height: 'auto',
    themeSystem: 'bootstrap5',

    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,listWeek'
    },

    events: {{ events|tojson }},

    eventClick: function(info) {
      // FullCalendar sets an event's id on info.event.id.
      // Some code may store custom ids in extendedProps; support both.
      var evId = info.event.id || info.event.extendedProps && info.event.extendedProps.id;
      if (evId) {
        window.location.href = "/task/" + evId + "/edit";
      }
    }
  });
  
  calendar.render();
});
</script>

{% endblock %}
